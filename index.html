<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leo 的个人主页</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: white;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
    }

    .card {
      width: min(90%, 620px);
      padding: 48px;
      text-align: center;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
    }

    .avatar {
      width: 110px;
      height: 110px;
      margin-bottom: 20px;
      border: 4px solid white;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 42px;
    }

    p {
      margin: 10px 0;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.88);
    }

    .links {
      margin-top: 28px;
    }

    .button {
      display: inline-block;
      margin: 6px;
      padding: 12px 22px;
      color: #4f46e5;
      font-weight: bold;
      text-decoration: none;
      background: white;
      border-radius: 999px;
      transition: transform 0.2s;
    }

    .button:hover {
      transform: translateY(-3px);
    }
  </style>
</head>

<body>
  <main class="card">
    <img
      class="avatar"
      src="https://github.com/leo2197.png"
      alt="Leo 的头像"
    >

    <h1>你好，我是 Leo 👋</h1>

    <p>一名计算机专业学生，正在学习编程与 Web 开发。</p>
    <p>欢迎来到我的个人网站，这里以后会展示我的项目、学习经历和作品。</p>

    <div class="links">
      <a class="button" href="https://github.com/leo2197">
        我的 GitHub
      </a>

      <a class="button" href="mailto:3405333751@qq.com">
        联系我
      </a>
    </div>
  </main>
</body>
</html>
